{{- if .Values.grpc.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zid.fullname" . }}-headless-grpc
  labels:
    {{- include "zid.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc
    {{- with .Values.grpc.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "zid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grpc
  {{- if not .Values.grpc.autoscaling.enabled }}
  replicas: {{ .Values.grpc.replicaCount }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "zid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grpc
        {{- with .Values.grpc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        revision: {{ .Release.Revision | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grpc.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsConfig.enabled }}
      dnsPolicy: {{ .Values.dnsConfig.policy | default "None" }}
      dnsConfig:
        {{- with .Values.dnsConfig.nameservers }}
        nameservers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.dnsConfig.options }}
        options:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.dnsConfig.searches }}
        searches:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.grpc.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.grpc.secretName }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          {{- with .Values.grpc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.grpc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: headless-grpc
              containerPort: {{ .Values.grpcService.port }}
              protocol: TCP
          {{- with .Values.grpc.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.grpc.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.grpc.preStopCommand }}
          lifecycle:
            preStop:
              exec:
                command:
                  {{- toYaml . | nindent 18 }}
          {{- end }}
          {{- with .Values.grpc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.grpc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grpc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grpc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
