{{- if .Values.http.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zid.fullname" . }}
  labels:
    {{- include "zid.labels" . | nindent 4 }}
    app.kubernetes.io/component: http
    {{- with .Values.http.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.http.autoscaling.enabled }}
  replicas: {{ .Values.http.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.http.rollingStrategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "zid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: http
  template:
    metadata:
      {{- with .Values.http.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zid.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: http
        {{- with .Values.http.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zid.serviceAccountName" . }}
      {{- with .Values.http.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsConfig.enabled }}
      dnsPolicy: {{ .Values.dnsConfig.policy | default "None" }}
      dnsConfig:
        {{- with .Values.dnsConfig.nameservers }}
        nameservers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.dnsConfig.options }}
        options:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.dnsConfig.searches }}
        searches:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.http.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.http.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.http.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.http.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.http.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.http.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.http.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.http.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.http.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
