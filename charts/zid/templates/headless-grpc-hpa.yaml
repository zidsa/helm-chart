apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "zid.fullname" . }}-headless-grpc
  labels:
    {{- include "zid.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "zid.fullname" . }}-headless-grpc
  minReplicas: {{ .Values.grpc.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.grpc.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.grpc.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.grpc.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.grpc.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.grpc.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
