image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
dnsConfig:
  enabled: false
  dnsConfig:
    dnsPolicy: "None"
    dnsConfig:
      nameservers:
        - 169.254.20.10
      options:
        - name: attempts
          value: "3"
        - name: ndots
          value: "5"
      searches:
        - prod.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        - eu-west-1.compute.internal
service:
  type: ClusterIP
  port: 80

grpcService:
  type: ClusterIP
  port: 50051

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
grpc:
  create: false
  replicaCount: 1
  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  # The kubelet uses liveness probes to know when to restart a container.
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    tcpSocket:
      port: 50051
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 4
  # The kubelet uses startup probe to indicates whether the application within the container is started
  # https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#when-should-you-use-a-startup-probe
  startupProbe: {}
  # The kubelet uses readiness probes to know when a container is ready to start accepting traffic.
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    exec:
      command: ["/bin/grpc_health_probe", "-addr=:50051"]
    initialDelaySeconds: 3
    timeoutSeconds: 10
    failureThreshold: 5
    successThreshold: 1
    periodSeconds: 10
  deploymentLabels: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
# -- Specify deployment rolling strategy: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  rollingStrategy: RollingUpdate
http:
  replicaCount: 1
  create: true
  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  # The kubelet uses liveness probes to know when to restart a container.
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe: {}
  # The kubelet uses startup probe to indicates whether the application within the container is started
  # https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#when-should-you-use-a-startup-probe
  startupProbe: {}
  # The kubelet uses readiness probes to know when a container is ready to start accepting traffic.
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe: {}
  deploymentLabels: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
# -- Specify deployment rolling strategy: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  rollingStrategy: RollingUpdate
